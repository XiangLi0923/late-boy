<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>阿莉的图</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">豆</div>
      <div class="brand-copy">
        <h1>阿莉的图</h1>
        <p>图片转拼豆图纸</p>
      </div>
    </header>

    <main class="app-main">
      <section class="panel upload-panel">
        <div class="panel-head">
          <h2>选择图片</h2>
          <span id="imageMeta" class="meta">PNG / JPG / WEBP</span>
        </div>
        <button id="chooseButton" class="button button-ghost upload-button" type="button">选择图片</button>
        <input id="fileInput" class="visually-hidden" type="file" accept="image/*">
        <div id="imagePreviewWrap" class="image-preview-wrap hidden">
          <img id="imagePreview" class="image-preview" alt="待处理图片预览">
        </div>
      </section>

      <div id="settingsArea" class="settings-area hidden">
        <section class="panel">
          <div class="panel-head">
            <h2>图像调整</h2>
          </div>

          <label class="range-row" for="brightness">
            <span>亮度 <strong id="brightnessValue">0.00</strong></span>
            <input id="brightness" type="range" min="-1" max="1" step="0.01" value="0">
          </label>

          <label class="range-row" for="contrast">
            <span>对比度 <strong id="contrastValue">1.00</strong></span>
            <input id="contrast" type="range" min="0" max="3" step="0.01" value="1">
          </label>

          <label class="range-row" for="blurSigma">
            <span>高斯模糊 <strong id="blurValue">0.0</strong></span>
            <input id="blurSigma" type="range" min="0" max="10" step="0.1" value="0">
          </label>

          <label class="range-row" for="edgeEnhance">
            <span>边缘增强 <strong id="edgeValue">1.2</strong></span>
            <input id="edgeEnhance" type="range" min="0" max="2" step="0.1" value="1.2">
          </label>

          <label class="check-row" for="autoContrast">
            <input id="autoContrast" type="checkbox" checked>
            <span>自动对比度优化</span>
          </label>

          <label class="check-row" for="mergeSimilarColors">
            <input id="mergeSimilarColors" type="checkbox" checked>
            <span>相似色替换</span>
          </label>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>主体分割</h2>
          </div>

          <label class="check-row" for="removeBackground">
            <input id="removeBackground" type="checkbox">
            <span>启用主体分割</span>
          </label>

          <div id="segmentationControls" class="sub-controls hidden">
            <label class="range-row" for="foregroundConfidence">
              <span>前景置信阈值 <strong id="confidenceValue">0.65</strong></span>
              <input id="foregroundConfidence" type="range" min="0.1" max="0.95" step="0.05" value="0.65">
            </label>

            <label class="range-row" for="edgeFeather">
              <span>边缘羽化半径 <strong id="featherValue">2</strong></span>
              <input id="edgeFeather" type="range" min="0" max="12" step="1" value="2">
            </label>

            <label class="range-row" for="maskOffset">
              <span>蒙版膨胀/收缩 <strong id="maskOffsetValue">0</strong></span>
              <input id="maskOffset" type="range" min="-12" max="12" step="1" value="0">
            </label>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>拼豆板尺寸</h2>
          </div>
          <div class="grid-size-row">
            <label for="gridWidth">宽
              <input id="gridWidth" type="number" min="1" max="200" value="50">
            </label>
            <span class="times">×</span>
            <label for="gridHeight">高
              <input id="gridHeight" type="number" min="1" max="200" value="50">
            </label>
          </div>
          <div id="gridPresets" class="chip-row"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>选择色卡</h2>
            <span id="paletteMeta" class="meta"></span>
          </div>
          <div id="paletteTabs" class="palette-tabs"></div>
          <div class="palette-preview">
            <h3>色板</h3>
            <p id="paletteBrand" class="palette-brand"></p>
            <div id="paletteSwatches" class="swatch-row"></div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>抖动模式</h2>
          </div>
          <div class="dither-list">
            <label class="radio-row" for="dither0">
              <input id="dither0" type="radio" name="dither" value="0">
              <span><strong>无抖动</strong><small>直接最近邻匹配</small></span>
            </label>
            <label class="radio-row" for="dither1">
              <input id="dither1" type="radio" name="dither" value="1" checked>
              <span><strong>Floyd-Steinberg</strong><small>过渡自然</small></span>
            </label>
            <label class="radio-row" for="dither2">
              <input id="dither2" type="radio" name="dither" value="2">
              <span><strong>Bayer 8×8</strong><small>图案感强</small></span>
            </label>
          </div>
        </section>

        <section class="process-block">
          <button id="processButton" class="button button-primary process-button" type="button">开始处理</button>
          <p id="statusText" class="status-text">等待处理</p>
        </section>
      </div>

      <section id="resultSection" class="panel result-panel hidden">
        <div class="panel-head result-head">
          <div>
            <h2>图纸预览</h2>
            <p id="resultMeta" class="meta"></p>
          </div>
          <button id="saveButton" class="button button-primary compact" type="button">保存到相册</button>
        </div>

        <div class="canvas-wrap">
          <canvas id="resultCanvas" class="result-canvas"></canvas>
        </div>

        <div class="canvas-tools">
          <button id="zoomOutButton" class="icon-button" type="button" aria-label="缩小">−</button>
          <button id="zoomInButton" class="icon-button" type="button" aria-label="放大">+</button>
          <button id="labelsButton" class="tool-button active" type="button">色号</button>
          <button id="mirrorButton" class="tool-button" type="button">镜像</button>
          <span id="zoomText" class="zoom-text">100%</span>
        </div>

        <div class="legend-block">
          <h3>颜色用量</h3>
          <div id="legendList" class="legend-list"></div>
        </div>
      </section>
    </main>

    <div id="progressOverlay" class="progress-overlay hidden" role="status" aria-live="polite">
      <div class="progress-card">
        <div class="spinner" aria-hidden="true"></div>
        <p id="progressText">正在生成图纸...</p>
      </div>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>

  <script src="./palette-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
